name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Verify Android project exists
        run: test -f android/app/build.gradle && test -f android/settings.gradle
      - name: Get dependencies
        run: flutter pub get
      - name: Build release arm64 only
        run: flutter build apk --release --target-platform android-arm64
      - name: Sign APK with debug key
        run: |
          export APKSIGNER=$ANDROID_HOME/build-tools/36.0.0/apksigner
          if [ ! -f $APKSIGNER ]; then APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | head -n 1); fi
          echo "Using apksigner: $APKSIGNER"
          keytool -genkeypair -v -keystore /tmp/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -d "CN=Android Debug,O=Android,C=US" -noprompt || true
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            echo "Signing $apk"
            $APKSIGNER sign --ks /tmp/debug.keystore --ks-pass pass:android --key-pass pass:android --out "${apk%.apk}-signed.apk" "$apk" || true
            mv "${apk%.apk}-signed.apk" "$apk"
          done
          ls -lh build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: misbahati-release-apk
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14
